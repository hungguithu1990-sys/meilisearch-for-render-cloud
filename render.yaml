
services:
  - type: web
    name: meilisearch-chatbot-memory
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MEILI_ENV
        value: production
      - key: MEILI_HTTP_ADDR
        value: 0.0.0.0:10000
      - key: MEILI_DB_PATH
        value: /meili_data/data.ms
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_MASTER_KEY
        generateValue: true
